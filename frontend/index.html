<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Email Spam Detector</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>Check Email for Spam</h1>
  <form id="emailForm">
    <input type="email" id="email_id" placeholder="Email ID" required><br><br>
    <input type="text" id="subject" placeholder="Subject" required><br><br>
    <textarea id="message" rows="5" placeholder="Message Body" required></textarea><br><br>
    <button type="submit">Predict</button>
  </form>
  <h2 id="result"></h2>
  <script>
    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email_id = document.getElementById('email_id').value;
      const subject = document.getElementById('subject').value;
      const message = document.getElementById('message').value;

      const response = await fetch("https://your-backend-api.onrender.com/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email_id, subject, message })
      });

      const data = await response.json();
      document.getElementById('result').innerText = `Prediction: ${data.result}`;
    });
  </script>
</body>

</html>
